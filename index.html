<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today — 기획 대시보드</title>
<style>
:root{
  --bg:#0e1015;--card:#161a22;--card2:#1b2029;--fg:#e8eaf0;--mut:#98a2b3;
  --acc:#5b9dff;--acc2:#7c5cff;--ok:#3ecf8e;--warn:#ffb454;--danger:#ff6b6b;
  --line:#262c38;--chip:#1f2632;
}
html[data-theme="light"]{
  --bg:#f5f7fb;--card:#ffffff;--card2:#eef2f8;--fg:#1a1f2b;--mut:#5a6472;
  --acc:#2f6fed;--acc2:#6b46e5;--ok:#12a366;--warn:#c77700;--danger:#e5484d;
  --line:#e3e7ef;--chip:#eef1f7;
}
html[data-theme="light"] body{background:radial-gradient(1200px 600px at 70% -10%,#e6edfc 0,var(--bg) 55%)}
html[data-theme="light"] .chip{color:#39424f}
html[data-theme="light"] .chip b{color:#111}
html[data-theme="light"] .persona .ava{background:#eaeff7}
html[data-theme="light"] .tag.main{color:#2456c9}
html[data-theme="light"] .tag.contrast{color:#5a37c2}
html[data-theme="light"] .decision b{color:#2456c9}
html[data-theme="light"] .progress{background:#e3e7ef}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:50;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.15rem;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.theme-toggle:hover{filter:brightness(1.1)}
.theme-toggle:active{transform:scale(.94)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#182033 0,var(--bg) 55%);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
header.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.hero .eyebrow{color:var(--acc);font-weight:600;letter-spacing:.04em;font-size:.8rem;text-transform:uppercase}
.hero h1{margin:.1em 0;font-size:2rem}
.hero p{color:var(--mut);margin:0;max-width:60ch}
.hero .chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;color:#cfd6e2}
.chip b{color:#fff}
section{margin-top:34px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-title h2{font-size:1.15rem;margin:0}
.sec-title span{color:var(--mut);font-size:.82rem}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:18px}
.stat .num{font-size:2rem;font-weight:700;line-height:1}
.stat .lbl{color:var(--mut);font-size:.82rem;margin-top:6px}
.stat .num.acc{color:var(--acc)}.stat .num.ok{color:var(--ok)}.stat .num.warn{color:var(--warn)}.stat .num.v2{color:var(--acc2)}
.cards2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.persona{position:relative;overflow:hidden}
.persona::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--acc)}
.persona.contrast::before{background:var(--acc2)}
.persona .who{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.persona .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:#222a38}
.persona h3{margin:0;font-size:1.05rem}
.persona .role{color:var(--mut);font-size:.82rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;margin-top:6px}
.tag.main{background:rgba(91,157,255,.15);color:#9cc2ff;border:1px solid rgba(91,157,255,.3)}
.tag.contrast{background:rgba(124,92,255,.15);color:#bca8ff;border:1px solid rgba(124,92,255,.3)}
.persona ul{margin:12px 0 0;padding-left:18px}
.persona li{margin:4px 0;font-size:.9rem}
.persona .goals li::marker{content:"🎯 "}
.persona .pains li::marker{content:"⚡ "}
.persona h4{margin:14px 0 4px;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.principles{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.pr .id{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:.9rem}
.pr .body strong{display:block;font-size:.92rem;margin-bottom:2px}
.pr .body small{color:var(--mut);font-size:.78rem}
.feat{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.frow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.frow .fid{color:var(--acc);font-weight:700;font-size:.82rem;flex:0 0 auto}
.frow small{color:var(--mut);display:block;font-size:.8rem}
.scope{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.scope .card h3{margin:0 0 10px;font-size:.95rem}
.scope ul{margin:0;padding-left:2px;list-style:none}
.scope li{margin:6px 0;font-size:.88rem;padding-left:24px;position:relative}
.scope .in li::before{content:"✅";position:absolute;left:0}
.scope .out li::before{content:"⛔";position:absolute;left:0}
.scope .v2 li::before{content:"🔮";position:absolute;left:0}
.dod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.progress{height:12px;background:#0c0f15;border-radius:999px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .35s ease}
.pmeta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut);margin-bottom:14px}
.dod label{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:.92rem}
.dod label:hover{background:var(--card2)}
.dod input{margin-top:3px;transform:scale(1.2);accent-color:var(--ok)}
.dod input:checked + span{color:var(--mut);text-decoration:line-through}
footer{margin-top:40px;color:var(--mut);font-size:.8rem;text-align:center}
.decision{background:linear-gradient(135deg,rgba(91,157,255,.1),rgba(124,92,255,.08));border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;margin-top:14px}
.decision b{color:#cfe0ff}
.launch{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:.95rem;
  color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 24px rgba(91,157,255,.25)}
.launch:hover{filter:brightness(1.08)}
.launch:active{transform:translateY(1px)}

/* ---- 라이브 투두 위젯 ---- */
.app-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:22px;max-width:560px}
.app-head{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 14px}
.app-head .d{color:var(--mut);font-size:.82rem}
.app-head .c{color:var(--acc);font-size:.82rem;font-weight:700}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-height:50px;padding:0 15px;font-size:1.02rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:13px;outline:none}
.add input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,157,255,.18)}
.add button{min-width:50px;min-height:50px;font-size:1.35rem;border:none;border-radius:13px;cursor:pointer;background:var(--acc);color:#fff;font-weight:700}
.add button:active{transform:scale(.96)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:9px 12px;min-height:54px}
.tlist .check{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tlist .check:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tlist li.done .check{background:var(--ok);border-color:var(--ok)}
.tlist .check svg{width:15px;height:15px;stroke:#0e1015;stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.tlist li.done .check svg{opacity:1}
.tlist .t{flex:1;font-size:1rem;word-break:break-word}
.tlist li.done .t{color:#5b6472;text-decoration:line-through}
.tlist .del{flex:0 0 auto;width:38px;height:38px;border:none;background:transparent;color:var(--mut);font-size:1.15rem;border-radius:9px;cursor:pointer}
.tlist .del:hover{color:var(--danger);background:rgba(255,107,107,.1)}
.tempty{text-align:center;color:var(--mut);padding:34px 16px}
.tempty .big{font-size:2rem}
</style>
<script>
  (function(){try{var t=localStorage.getItem('dash.theme');
    if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
    document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="라이트/다크 테마 전환" title="라이트/다크 전환">🌙</button>
<div class="wrap">

  <header class="hero">
    <h1>📋 Today — 오늘 할 일</h1>
    <p>오늘 해야 할 일만 빠르게 적고 체크하는 미니멀 투두. <b>적는 데 3초, 체크하는 데 1초.</b></p>
    <div class="chips">
      <span class="chip">☁️ 클라우드 저장</span>
      <span class="chip">📱 모바일 우선</span>
      <span class="chip">🌙 다크/라이트</span>
      <span class="chip">🌅 자정 자동 이월</span>
    </div>
  </header>

  <!-- LIVE APP -->
  <section id="live">
    <div class="app-card">
      <div class="app-head">
        <div><strong>오늘 할 일</strong> <span class="d" id="tvDate"></span></div>
        <div class="c" id="tvCount"></div>
      </div>
      <form class="add" id="tvForm" autocomplete="off">
        <input id="tvInput" type="text" placeholder="할 일을 적고 Enter" aria-label="할 일 추가" maxlength="200">
        <button type="submit" aria-label="추가">＋</button>
      </form>
      <ul class="tlist" id="tvList" aria-live="polite"></ul>
      <div class="tempty" id="tvEmpty" hidden>
        <div class="big">📝</div>
        <p>오늘은 아직 아무것도 없어요. 위에 첫 할 일을 적어보세요.</p>
      </div>
    </div>
  </section>

  <footer>
    Today · 오늘 할 일 미니멀 투두 · 데이터는 Supabase 클라우드에 저장됩니다
  </footer>
</div>

<script>
  // ===== 테마 토글 (라이트/다크) =====
  (function(){
    var tt=document.getElementById('themeToggle');
    function syncIcon(){var t=document.documentElement.getAttribute('data-theme');tt.textContent=(t==='light')?'🌙':'☀️';}
    tt.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme');
      var nx=(cur==='light')?'dark':'light';
      document.documentElement.setAttribute('data-theme',nx);
      try{localStorage.setItem('dash.theme',nx);}catch(e){}
      syncIcon();
    });
    syncIcon();
  })();

  // ===== 라이브 투두 위젯 (요구사항 F1–F5 / R1–R4) — Supabase 클라우드 저장 =====
  (function(){
    "use strict";
    var SUPABASE_URL="https://dbzrzvmbqakdykmzhowe.supabase.co";
    var SUPABASE_KEY="sb_publishable_mNsYyS7r68tQR4jt3eHdFQ_noyGoqVq";
    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var todos=[], busy=false;
    var list=document.getElementById('tvList'), empty=document.getElementById('tvEmpty'),
        count=document.getElementById('tvCount'), input=document.getElementById('tvInput');

    function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
    function prettyDate(){var d=new Date(),wd=["일","월","화","수","목","금","토"][d.getDay()];return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+wd+")";}

    // 클라우드에서 전체 목록 로드 (created_at 순)
    function loadData(){
      return sb.from('todos').select('id,title,done,created_at,todo_date').order('created_at',{ascending:true})
        .then(function(res){ todos=(res&&res.data)?res.data:[]; if(res&&res.error)console.error(res.error); });
    }
    function refresh(){ return loadData().then(draw); }

    // R1–R3: 지난 미완료 항목의 날짜를 오늘로, 무음
    function rollover(){
      var t=todayStr();
      return sb.from('todos').update({todo_date:t}).eq('done',false).lt('todo_date',t).then(function(){});
    }

    function add(title){title=title.trim();if(!title||busy)return;busy=true;
      sb.from('todos').insert({title:title,done:false,todo_date:todayStr()}).then(refresh).then(function(){busy=false;});}
    function toggle(id){var t=todos.find(function(x){return x.id===id;});if(!t||busy)return;busy=true;
      sb.from('todos').update({done:!t.done}).eq('id',id).then(refresh).then(function(){busy=false;});}
    function remove(id){if(busy)return;busy=true;
      sb.from('todos').delete().eq('id',id).then(refresh).then(function(){busy=false;});}

    function draw(){ // R4: 오늘 항목만, 추가 순서 (쿼리에서 이미 created_at 정렬)
      var t=todayStr();
      var day=todos.filter(function(x){return x.todo_date===t;});
      list.innerHTML="";
      day.forEach(function(td){
        var li=document.createElement('li'); if(td.done)li.className="done";
        var b=document.createElement('button'); b.className="check"; b.setAttribute("role","checkbox");
        b.setAttribute("aria-checked",td.done?"true":"false"); b.setAttribute("aria-label",(td.done?"완료 취소: ":"완료: ")+td.title);
        b.innerHTML='<svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg>';
        b.addEventListener("click",function(){toggle(td.id);});
        var s=document.createElement('span'); s.className="t"; s.textContent=td.title;
        var d=document.createElement('button'); d.className="del"; d.setAttribute("aria-label","삭제: "+td.title); d.textContent="✕";
        d.addEventListener("click",function(){remove(td.id);});
        li.appendChild(b); li.appendChild(s); li.appendChild(d); list.appendChild(li);
      });
      var remain=day.filter(function(x){return !x.done;}).length, isEmpty=day.length===0;
      empty.hidden=!isEmpty; list.hidden=isEmpty;
      count.textContent=isEmpty?"":(remain===0?"다 했어요 🎉":"남은 "+remain+"개");
    }

    var composing=false;
    input.addEventListener("compositionstart",function(){composing=true;});
    input.addEventListener("compositionend",function(){composing=false;});
    document.getElementById('tvForm').addEventListener("submit",function(e){
      e.preventDefault(); if(composing)return;      // IME 조합 확정 Enter 무시
      add(input.value); input.value=""; input.focus();
    });

    document.getElementById('tvDate').textContent=prettyDate();
    rollover().then(refresh);
    document.addEventListener("visibilitychange",function(){if(!document.hidden){rollover().then(refresh);}});
  })();
</script>
</body>
</html>
